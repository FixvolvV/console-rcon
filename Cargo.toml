# =============================================================================
# Cargo.toml — манифест Rust-проекта scpsl-wrapper
# =============================================================================
# Этот файл описывает метаданные проекта и его зависимости.
# Cargo (пакетный менеджер Rust) использует его для сборки проекта.
# =============================================================================

[package]
# Имя пакета — будет использоваться как имя бинарного файла
name = "scpsl-wrapper"
# Версия проекта в формате SemVer (major.minor.patch)
version = "0.1.0"
# Edition — версия "диалекта" Rust. 2021 — последняя стабильная на момент написания
edition = "2021"
# Краткое описание для crates.io (если будем публиковать)
description = "WebSocket-based RCON wrapper for SCP: Secret Laboratory server"
# Лицензия проекта
license = "MIT"

# =============================================================================
# ЗАВИСИМОСТИ
# =============================================================================
# Каждая зависимость — это внешняя библиотека (crate), которую Cargo скачает
# с crates.io и скомпилирует вместе с нашим кодом.
# =============================================================================

[dependencies]

# -----------------------------------------------------------------------------
# TOKIO — асинхронный runtime
# -----------------------------------------------------------------------------
# Rust сам по себе не имеет встроенного async runtime. Tokio — стандарт де-факто.
# "full" features включает всё: многопоточный executor, таймеры, I/O, каналы и т.д.
# Без tokio мы не сможем использовать async/await.
tokio = { version = "1", features = ["full"] }

# -----------------------------------------------------------------------------
# TOKIO-TUNGSTENITE — WebSocket клиент поверх tokio
# -----------------------------------------------------------------------------
# Tungstenite — популярная WebSocket-библиотека для Rust.
# tokio-tungstenite — её асинхронная версия, интегрированная с tokio.
# Мы используем её для подключения к FastAPI серверу.
# "native-tls" feature — использует системную TLS-библиотеку для wss://
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# -----------------------------------------------------------------------------
# URL — утилиты для работы с URL
# -----------------------------------------------------------------------------
# Нужна для правильного построения URL с query-параметрами.
# Например: ws://host/path?server_name=server1
url = "2"

# -----------------------------------------------------------------------------
# SERDE + SERDE_JSON — сериализация/десериализация
# -----------------------------------------------------------------------------
# Serde — фреймворк для преобразования Rust-структур в/из различных форматов.
# "derive" feature позволяет использовать #[derive(Serialize, Deserialize)]
# на структурах — макрос автоматически генерирует код сериализации.
serde = { version = "1", features = ["derive"] }
# serde_json — конкретная реализация для JSON-формата
serde_json = "1"

# -----------------------------------------------------------------------------
# TRACING — структурированное логирование
# -----------------------------------------------------------------------------
# Tracing — современная библиотека логирования для Rust.
# В отличие от простого log, поддерживает spans (области), structured logging,
# и хорошо интегрируется с async-кодом.
tracing = "0.1"
# tracing-subscriber — подписчик, который выводит логи в stdout/stderr.
# "env-filter" feature позволяет настраивать уровень логов через RUST_LOG env.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# -----------------------------------------------------------------------------
# CLAP — парсинг CLI-аргументов
# -----------------------------------------------------------------------------
# Clap — мощная библиотека для создания command-line интерфейсов.
# "derive" feature позволяет описывать CLI через структуры с атрибутами.
# "env" feature позволяет автоматически читать значения из переменных окружения.
clap = { version = "4", features = ["derive", "env"] }

# -----------------------------------------------------------------------------
# FUTURES-UTIL — расширения для работы с futures
# -----------------------------------------------------------------------------
# Предоставляет трейты StreamExt и SinkExt, которые нужны для работы
# с WebSocket-соединением (чтение/запись сообщений как stream/sink).
futures-util = "0.3"

# -----------------------------------------------------------------------------
# REGEX — регулярные выражения
# -----------------------------------------------------------------------------
# Нужна для вырезания ANSI escape-кодов из stdout (опционально).
# Rust не имеет встроенных регулярок, поэтому используем эту библиотеку.
regex = "1"

# -----------------------------------------------------------------------------
# LAZY_STATIC — ленивая инициализация статических переменных
# -----------------------------------------------------------------------------
# Позволяет создавать статические переменные, которые инициализируются
# при первом обращении. Нужно для компиляции regex один раз.
lazy_static = "1.4"

# -----------------------------------------------------------------------------
# LIBC — низкоуровневые биндинги к C библиотеке
# -----------------------------------------------------------------------------
# Нужна для отправки Unix-сигналов (SIGTERM) дочернему процессу.
# Без этого мы не смогли бы корректно завершить SCPSL.
libc = "0.2"

# =============================================================================
# ПРОФИЛЬ RELEASE — оптимизации для production-сборки
# =============================================================================
[profile.release]
# LTO (Link-Time Optimization) — оптимизация на этапе линковки.
# Делает бинарь меньше и быстрее, но сборка дольше.
lto = true
# Одна единица компиляции — лучше оптимизация, но медленнее сборка.
codegen-units = 1
# Убираем символы отладки — меньше размер бинаря.
strip = true
